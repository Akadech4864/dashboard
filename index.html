<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>CIB Case Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=8">
</head>
<body>
<!-- หน้าล็อกอิน -->
<section id="login">
  <div class="login-card">
    <img src="logo.jpg" alt="CIB" class="login-logo">
    <h1>ระบบข้อมูลคดี</h1>
    <p class="muted">เอกสารลับ — เฉพาะผู้ได้รับอนุญาต</p>
    <form id="loginForm" autocomplete="off">
      <input id="pw" type="password" inputmode="numeric" placeholder="รหัสผ่าน" aria-label="รหัสผ่าน" autofocus>
      <button type="submit" id="loginBtn">เข้าสู่ระบบ</button>
    </form>
    <p id="loginMsg" class="err"></p>
  </div>
</section>

<!-- แอป -->
<div id="app" hidden>
  <header class="top">
    <img src="logo.jpg" alt="CIB" class="top-logo">
    <div class="top-title">
      <b id="caseTitle">ข้อมูลคดี</b>
      <span id="madeAt"></span>
    </div>
    <button id="editBtn" class="ghost" title="เปิด/ปิดโหมดแก้ไข">แก้ไข</button>
    <button id="setBtn" class="ghost" title="ตั้งค่าฐานข้อมูล">ตั้งค่า</button>
    <button id="outBtn" class="ghost" title="ออกจากระบบ">ออก</button>
  </header>
  <nav id="tabs" class="tabs"></nav>
  <main id="main"></main>
  <footer class="foot">เอกสารลับ ใช้ในการสอบสวนเท่านั้น — ตัวเลขจาก statement ต้องตรวจทานก่อนใช้อ้างอิง</footer>
</div>

<div id="modal" class="modal" hidden><div class="modal-box" id="modalBox"></div></div>
<div id="viewer" class="viewer" hidden><div class="viewer-bar"><span id="viewerCap"></span><button data-z="-1" title="ย่อ">−</button><button data-z="1" title="ขยาย">+</button><button data-z="0">พอดีจอ</button><button data-z="9">100%</button><button id="viewerClose">ปิด ✕</button></div><div class="viewer-scroll"><div id="viewerBox"></div></div></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="app.js?v=8"></script>
</body>
</html>
