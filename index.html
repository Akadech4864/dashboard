<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>CIB Case Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=30">
<link rel="stylesheet" href="shell.css?v=46">
</head>
<body>
<!-- หน้าล็อกอิน -->
<section id="login">
  <div class="login-card">
    <img src="logo.jpg" alt="CIB" class="login-logo">
    <h1>ระบบข้อมูลคดี</h1>
    <p class="muted">เอกสารลับ — เฉพาะผู้ได้รับอนุญาต</p>
    <form id="loginForm" autocomplete="off">
      <input id="pw" type="password" inputmode="numeric" placeholder="รหัสผ่าน" aria-label="รหัสผ่าน" autofocus>
      <button type="submit" id="loginBtn">เข้าสู่ระบบ</button>
    </form>
    <p id="loginMsg" class="err"></p>
  </div>
</section>

<!-- แอป (โครงใหม่ 19 พ.ย. 69: คอม = เมนูข้าง + แถบย่อย ; มือถือ = แถบล่าง 5 ไอคอน + เมนู 3 ขีด) -->
<div id="app" hidden>
  <header class="top">
    <button id="menuBtn" class="ib only-m" aria-label="เมนู"></button>
    <button id="backBtn" class="ib" aria-label="ย้อนกลับ" hidden></button>
    <img src="logo.jpg" alt="CIB" class="top-logo only-d">
    <div class="top-title"><b id="pageTitle"></b><span class="only-d"><span id="caseTitle"></span> · <span id="madeAt"></span></span></div>
    <button id="srchBtn" class="sbar" aria-label="ค้นหา"></button>
    <button id="prefBtn" class="ib" aria-label="ตั้งค่า"></button>
  </header>
  <nav id="tabs" class="side" aria-label="เมนู"></nav>
  <div id="drawerMask" class="mask" hidden></div>
  <aside id="sub" class="subpanel" hidden></aside>
  <main id="main"></main>
  <nav id="bnav" class="bnav" aria-label="เมนูหลัก"></nav>
  <footer class="foot">เอกสารลับ — ใช้ในการสอบสวนเท่านั้น · ตัวเลขจาก statement ต้องตรวจทานก่อนอ้างอิง</footer>
</div>
<div id="prefs" class="sheet" hidden><div class="sheet-box"><div class="sheet-hd"><b>ตั้งค่าการแสดงผล</b><button class="ib" data-close="1" aria-label="ปิด">✕</button></div><div class="sheet-body"></div></div></div>
<div id="search" class="search" hidden><div class="search-box"><div class="search-in"><input id="sq" type="search" placeholder="ค้นหา ชื่อ · เลขบัญชี · ยอดเงิน · หน้า" autocomplete="off"><button class="ib" data-close="1" aria-label="ปิด">✕</button></div><div id="sres"></div></div></div>

<div id="modal" class="modal" hidden><div class="modal-box" id="modalBox"></div></div>
<div id="viewer" class="viewer" hidden><div class="viewer-bar"><span id="viewerCap"></span><button data-z="-1" title="ย่อ">−</button><button data-z="1" title="ขยาย">+</button><button data-z="0">พอดีจอ</button><button data-z="9">100%</button><button id="viewerClose">ปิด ✕</button></div><div class="viewer-scroll"><div id="viewerBox"></div></div></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="app.js?v=94"></script>
<script src="shell.js?v=40"></script>
<script src="estate3d.js?v=4"></script>
<script src="ai.js?v=17"></script>
</body>
</html>
